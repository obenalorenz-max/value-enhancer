[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "value-enhancer"
version = "0.1.0"
description = "High-Performance Unified OSINT & Digital Reconnaissance Intelligence Suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "obenalorenz-max" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "phonenumbers>=8.13.0",
    "dnspython>=2.6.0",
    "pillow>=10.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
value-enhancer = "value_enhancer.cli:main"
